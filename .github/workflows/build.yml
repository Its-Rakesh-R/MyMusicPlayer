name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract All ZIP Files
        run: |
          for f in *.zip; do
            [ -e "$f" ] || continue
            echo "Extracting $f..."
            unzip -o "$f"
          done
          # If extracted into a nested subfolder, move everything to root
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            find . -maxdepth 2 -name "build.gradle*" -execdir cp -r . ../ \; || true
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install and Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MusicPlayer-APK
          path: "**/build/outputs/apk/**/*.apk"
          
